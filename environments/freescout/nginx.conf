# FreeScout's recommended nginx site (tools/install.sh in FreeScout), with PHP-FPM on TCP and logs to the container output.
server {
	listen 80;
	server_name 127.0.0.1 localhost;

	root /var/www/html/public;

	index index.php index.html index.htm;

	access_log /dev/stdout;
	error_log /dev/stderr;

	# nginx listens on 80 inside the container; keep redirects on the published port.
	absolute_redirect off;

	# Max. attachment size; PHP's upload_max_filesize and post_max_size must allow it too.
	client_max_body_size 20M;

	location / {
		try_files $uri $uri/ /index.php?$query_string;
	}
	location ~ \.php$ {
		fastcgi_split_path_info ^(.+\.php)(/.+)$;
		fastcgi_pass 127.0.0.1:9000;
		fastcgi_index index.php;
		fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		include fastcgi_params;
		# Debian's fastcgi_params passes $host, without the published port, so FreeScout would build URLs without it.
		fastcgi_param HTTP_HOST $http_host;
	}
	location ~* ^/storage/attachment/ {
		expires 1M;
		access_log off;
		try_files $uri $uri/ /index.php?$query_string;
	}
	# Short expiration for .css and .js files.
	location ~* ^/(?:css|js)/.*\.(?:css|js)$ {
		expires 2d;
		access_log off;
		add_header Cache-Control "public, must-revalidate";
		add_header X-Content-Type-Options "nosniff";
	}
	# Force /storage/* files to be downloaded instead of shown; in sync with FreeScout's config/app.php.
	location ~* ^/storage/.*\.((?!(jpg|jpeg|jfif|pjpeg|pjp|apng|bmp|gif|ico|cur|png|tif|tiff|webp|pdf|txt|diff|patch|json|mp3|wav|ogg|wma)).)*$ {
		add_header Content-disposition "attachment; filename=$2";
		add_header X-Content-Type-Options "nosniff";
		default_type application/octet-stream;
	}
	# Long expiration for files in /storage or any files having a dot in their names.
	location ~* ^/(storage/|.*\.).*$ {
		expires 1M;
		access_log off;
		add_header Cache-Control "public";
		add_header X-Content-Type-Options "nosniff";
	}
	location ~ /\. {
		deny all;
	}
}

# Drops requests for any other host, so a DNS-rebound page can't reach the app.
server {
	listen 80 default_server;
	return 444;
}
