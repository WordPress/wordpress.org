# Local FreeScout with the freescout.wordpress.net modules. See environments/README.md.
name: wporg-freescout

services:
  app:
    build:
      context: .
      args:
        FREESCOUT_REF: ${FREESCOUT_REF:-dist}
    image: wporg-freescout:${FREESCOUT_REF:-dist}
    ports:
      - "127.0.0.1:${FREESCOUT_PORT:-8890}:80"
    environment:
      # Not localhost: FreeScout treats that as "not installed" and guesses its URL prefix from the running script.
      APP_URL: http://127.0.0.1:${FREESCOUT_PORT:-8890}
      APP_DEBUG: "true"
      # Installed with PHPUnit as a dev dependency; it would otherwise overlay every page.
      DEBUGBAR_ENABLED: "false"
      APP_KEY_FILE: /var/www/html/storage/app-key
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: freescout
      DB_USERNAME: freescout
      DB_PASSWORD: freescout
      DB_TEST_HOST: db
      DB_TEST_DATABASE: freescout-test
      DB_TEST_USERNAME: freescout
      DB_TEST_PASSWORD: freescout
      WPORG_API_URL: ${WPORG_API_URL:-http://mock-api:8080/}
      WPORG_API_SECRET: ${WPORG_API_SECRET:-local-secret}
      WPORG_USERNAME: ${WPORG_USERNAME:-}
      WPORG_AKISMET_KEY: ${WPORG_AKISMET_KEY:-}
      WPORG_HELPSCOUT_APP_ID: ${WPORG_HELPSCOUT_APP_ID:-}
      WPORG_HELPSCOUT_APP_SECRET: ${WPORG_HELPSCOUT_APP_SECRET:-}
      # The mock identity provider in mock-api; its key is for local development only.
      WPORG_SSO_IDP_ENTITY_ID: http://127.0.0.1:${MOCK_IDP_PORT:-8892}/idp
      WPORG_SSO_IDP_URL: http://127.0.0.1:${MOCK_IDP_PORT:-8892}/idp
      WPORG_SSO_IDP_CERT: 
      MAILPIT_PORT: ${MAILPIT_PORT:-8891}
    volumes:
      - storage:/var/www/html/storage
      # Like production's checkout: our modules are FreeScout's Modules/ folder.
      - ../../freescout.wordpress.net/Modules:/var/www/html/Modules
      - ../../freescout.wordpress.net:/srv/wporg
      - .:/srv/env:ro
    depends_on:
      db:
        condition: service_healthy
      # Setup connects the admin to a mock WordPress.org account.
      mock-api:
        condition: service_started

  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: freescout
      MARIADB_USER: freescout
      MARIADB_PASSWORD: freescout
    volumes:
      - db:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 2s
      retries: 30

  # Incoming mail: FreeScout fetches the mailboxes over IMAP. Any password is accepted.
  greenmail:
    image: greenmail/standalone:2.1.3
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled
        -Dgreenmail.users.login=email

  # Outgoing mail: replies to senders land here instead of the internet.
  mailpit:
    image: axllent/mailpit:v1.31.3
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8891}:8025"

  # Stands in for the api.wordpress.org helpdesk endpoints, and login.wordpress.org's identity provider.
  mock-api:
    image: php:8.3-cli
    command: [ "php", "-S", "0.0.0.0:8080", "/srv/mock-api/index.php" ]
    ports:
      - "127.0.0.1:${MOCK_IDP_PORT:-8892}:8080"
    environment:
      WPORG_API_SECRET: local-secret
      IDP_ENTITY_ID: http://127.0.0.1:${MOCK_IDP_PORT:-8892}/idp
    volumes:
      - ./mock-api:/srv/mock-api:ro
      # Signs responses with WPOrgSSO's SAML library and test identity provider.
      - ../../freescout.wordpress.net/Modules:/srv/modules:ro

# One database and storage per FreeScout ref: trying master migrates its database forward, which dist can't run on.
volumes:
  storage:
    name: wporg-freescout-storage-${FREESCOUT_REF:-dist}
  db:
    name: wporg-freescout-db-${FREESCOUT_REF:-dist}
