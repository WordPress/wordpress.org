name: Unit Tests

on:
  pull_request:
  push:
    branches: [ trunk ]

# Cancel superseded PR runs. Trunk pushes get a unique group per commit —
# queued runs would otherwise be cancelled, leaving mirrored commits untested.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || '' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # Run only the suites the changed files can break, as defined in
  # .github/unit-tests-suites.yml.
  changes:
    name: Detect affected suites
    if: github.event_name == 'pull_request' || github.repository == 'WordPress/wordpress.org'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      standalone: ${{ steps.matrices.outputs.standalone }}
      wordpress: ${{ steps.matrices.outputs.wordpress }}
    steps:
      - uses: actions/checkout@v7

      # Emit path filters (suite paths plus type-shared ones) and matrices.
      - name: Load suite definitions
        id: suites
        run: |
          suites=$( yq -o=json '.' .github/unit-tests-suites.yml )
          {
            echo "filters=$( jq -c '.["shared-paths"] as $shared | .suites | with_entries( .value |= ( $shared[ .type ] + .paths ) )' <<< "$suites" )"
            echo "standalone=$( jq -c '.suites | to_entries | map( select( .value.type == "standalone" ) | { filter: .key } + ( .value | del( .type, .paths ) ) )' <<< "$suites" )"
            echo "wordpress=$( jq -c '.suites | to_entries | map( select( .value.type == "wordpress" ) | { filter: .key } + ( .value | del( .type, .paths ) ) )' <<< "$suites" )"
          } >> "$GITHUB_OUTPUT"

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: ${{ steps.suites.outputs.filters }}

      - name: Build suite matrices
        id: matrices
        env:
          CHANGES: ${{ steps.filter.outputs.changes }}
          STANDALONE: ${{ steps.suites.outputs.standalone }}
          WORDPRESS: ${{ steps.suites.outputs.wordpress }}
        run: |
          {
            echo "standalone=$( jq -c --argjson changed "$CHANGES" 'map( select( .filter as $f | $changed | index( $f ) ) )' <<< "$STANDALONE" )"
            echo "wordpress=$( jq -c --argjson changed "$CHANGES" 'map( select( .filter as $f | $changed | index( $f ) ) )' <<< "$WORDPRESS" )"
          } >> "$GITHUB_OUTPUT"

  # Standalone PHP tests — no WordPress or database dependency.
  # Uses the project's composer-installed PHPUnit 9 + yoast/phpunit-polyfills,
  # matching the version that WordPress Core ships its test bootstrap for.
  php-standalone:
    name: "PHP: ${{ matrix.name }}"
    needs: changes
    if: needs.changes.outputs.standalone != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.standalone) }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@v4

      - name: Create wpdb stub bootstrap
        if: matrix.bootstrap == 'wpdb-stub'
        run: |
          cat > /tmp/phpunit-bootstrap.php << 'PHPEOF'
          <?php
          class wpdbStub {
              public function prepare( $query, ...$args ) { return $query; }
              public function get_results( $query, $output = 'OBJECT' ) { return []; }
          }
          PHPEOF

      - name: Run PHPUnit
        working-directory: ${{ matrix.working-directory }}
        run: ${{ github.workspace }}/vendor/bin/phpunit ${{ matrix.phpunit-args }}

  # WordPress-dependent PHP tests — require wp-env (Docker).
  php-wordpress:
    name: "WP: ${{ matrix.name }}"
    needs: changes
    if: needs.changes.outputs.wordpress != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # One entry per environment. A script covering several plugins runs
        # them all against the environment it starts once.
        include: ${{ fromJSON(needs.changes.outputs.wordpress) }}
    defaults:
      run:
        working-directory: environments
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: environments/.nvmrc
          cache: npm
          cache-dependency-path: environments/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Cache sources for up to a day. No restore-keys: wp-env never updates
      # existing sources, so an older cache would pin CI to stale WordPress.
      - name: Get cache day
        id: cache-day
        run: echo "date=$( date -u +%F )" >> "$GITHUB_OUTPUT"

      # wp-env homes in ~/wp-env (not ~/.wp-env) on snap hosts like GH runners.
      - name: Cache wp-env sources
        uses: actions/cache@v6
        with:
          path: |
            ~/.wp-env
            ~/wp-env
          key: wp-env-${{ matrix.filter }}-${{ steps.cache-day.outputs.date }}-${{ hashFiles('environments/**/.wp-env*.json') }}

      # The scripts start their environment, whose `afterStart` installs PHPUnit
      # and the polyfills, and then run each suite it holds.
      - name: Run PHPUnit
        run: npm run ${{ matrix.script }}
