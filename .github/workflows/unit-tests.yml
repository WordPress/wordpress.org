name: Unit Tests

on:
  pull_request:
  push:
    branches: [ trunk ]
  # Daily full run: path filtering means regular runs never re-validate the
  # suites against their unpinned external inputs (WordPress trunk, PHPUnit,
  # the polyfills, jetpack.zip), so upstream breakage would land silently.
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

# Cancel superseded PR runs. Trunk pushes get a unique group per commit —
# queued runs would otherwise be cancelled, leaving mirrored commits untested.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || '' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # Run only the suites the changed files can break, as defined in
  # .github/unit-tests-suites.yml.
  changes:
    name: Detect affected suites
    if: github.event_name == 'pull_request' || github.repository == 'WordPress/wordpress.org'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      standalone: ${{ steps.matrices.outputs.standalone }}
      wordpress: ${{ steps.matrices.outputs.wordpress }}
    steps:
      - uses: actions/checkout@v7

      # Emit path filters (suite paths plus type-shared ones) and matrices.
      - name: Load suite definitions
        id: suites
        run: |
          suites=$( yq -o=json '.' .github/unit-tests-suites.yml )

          # Reject suites the matrix builders below would silently drop.
          invalid=$( jq -r '.suites | to_entries | map( select( ( .value.type | IN( "standalone", "wordpress" ) | not ) or ( .value.paths // [] ) == [] ) | .key ) | join( ", " )' <<< "$suites" )
          if [ -n "$invalid" ]; then
            echo "::error file=.github/unit-tests-suites.yml::Suites with an unknown type or no paths: $invalid"
            exit 1
          fi

          # Add each wordpress suite's plugins to its paths, straight from the
          # environment config, so the two can never drift apart.
          for suite in $( jq -r '.suites | to_entries[] | select( .value.type == "wordpress" ) | .key' <<< "$suites" ); do
            plugins=$( jq -c '[ .plugins[] | select( startswith( "../" ) ) | sub( "^\\.\\./"; "" ) + "/**" ]' "environments/$suite/.wp-env.test.json" )
            suites=$( jq -c --arg suite "$suite" --argjson plugins "$plugins" '.suites[ $suite ].paths += $plugins' <<< "$suites" )
          done

          filters=$( jq -c '.["shared-paths"] as $shared | .suites | with_entries( .value |= ( $shared[ .type ] + .paths ) )' <<< "$suites" )
          standalone=$( jq -c '.suites | to_entries | map( select( .value.type == "standalone" ) | { filter: .key } + ( .value | del( .type, .paths ) ) )' <<< "$suites" )
          wordpress=$( jq -c '.suites | to_entries | map( select( .value.type == "wordpress" ) | { filter: .key } + ( .value | del( .type, .paths ) ) )' <<< "$suites" )
          {
            echo "filters=$filters"
            echo "standalone=$standalone"
            echo "wordpress=$wordpress"
          } >> "$GITHUB_OUTPUT"

      - name: Detect changed paths
        id: filter
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v4
        with:
          filters: ${{ steps.suites.outputs.filters }}

      - name: Build suite matrices
        id: matrices
        env:
          CHANGES: ${{ steps.filter.outputs.changes }}
          STANDALONE: ${{ steps.suites.outputs.standalone }}
          WORDPRESS: ${{ steps.suites.outputs.wordpress }}
        run: |
          if [ -z "$CHANGES" ]; then
            # Scheduled and manual runs re-test everything.
            standalone="$STANDALONE"
            wordpress="$WORDPRESS"
          else
            standalone=$( jq -c --argjson changed "$CHANGES" 'map( select( .filter as $f | $changed | index( $f ) ) )' <<< "$STANDALONE" )
            wordpress=$( jq -c --argjson changed "$CHANGES" 'map( select( .filter as $f | $changed | index( $f ) ) )' <<< "$WORDPRESS" )
          fi
          {
            echo "standalone=$standalone"
            echo "wordpress=$wordpress"
          } >> "$GITHUB_OUTPUT"

  # Standalone PHP tests — no WordPress or database dependency.
  # Uses the project's composer-installed PHPUnit 9 + yoast/phpunit-polyfills,
  # matching the version that WordPress Core ships its test bootstrap for.
  php-standalone:
    name: "PHP: ${{ matrix.name }}"
    needs: changes
    if: needs.changes.outputs.standalone != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.standalone) }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@v4

      - name: Create wpdb stub bootstrap
        if: matrix.bootstrap == 'wpdb-stub'
        run: |
          cat > /tmp/phpunit-bootstrap.php << 'PHPEOF'
          <?php
          class wpdbStub {
              public function prepare( $query, ...$args ) { return $query; }
              public function get_results( $query, $output = 'OBJECT' ) { return []; }
          }
          PHPEOF

      - name: Run PHPUnit
        working-directory: ${{ matrix.working-directory }}
        run: ${{ github.workspace }}/vendor/bin/phpunit ${{ matrix.phpunit-args }}

  # WordPress-dependent PHP tests — require wp-env (Docker).
  php-wordpress:
    name: "WP: ${{ matrix.name }}"
    needs: changes
    if: needs.changes.outputs.wordpress != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # One entry per environment. A script covering several plugins runs
        # them all against the environment it starts once.
        include: ${{ fromJSON(needs.changes.outputs.wordpress) }}
    defaults:
      run:
        working-directory: environments
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: environments/.nvmrc
          cache: npm
          cache-dependency-path: environments/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Cache sources for up to a day. No restore-keys: a restored cache
      # brings its wp-env config-hash marker (wp-env-cache.json) with it, and
      # when that matches, wp-env start skips source downloads and WordPress
      # configuration entirely — an older cache would pin CI to stale
      # WordPress instead of being refreshed.
      - name: Get cache day
        id: cache-day
        run: echo "date=$( date -u +%F )" >> "$GITHUB_OUTPUT"

      # wp-env homes in ~/wp-env (not ~/.wp-env) on snap hosts like GH runners.
      - name: Cache wp-env sources
        uses: actions/cache@v6
        with:
          path: |
            ~/.wp-env
            ~/wp-env
          key: wp-env-${{ matrix.filter }}-${{ steps.cache-day.outputs.date }}-${{ hashFiles(format('environments/{0}/.wp-env.test.json', matrix.filter), 'environments/package-lock.json') }}

      # The scripts start their environment, whose `afterStart` installs PHPUnit
      # and the polyfills, and then run each suite it holds.
      - name: Run PHPUnit
        run: npm run ${{ matrix.script }}

  # Stable status check for branch protection: the suite jobs are conditional
  # with matrix-derived names, so this is the one check that always runs and
  # reflects the overall result.
  results:
    name: Test results
    needs: [ changes, php-standalone, php-wordpress ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if a suite failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
