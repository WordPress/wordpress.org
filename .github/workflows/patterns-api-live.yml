name: Patterns API (live)

# Runs the e2e group against the live api.wordpress.org Patterns endpoint, which
# serves production pattern data. Kept out of the PR matrix so transient external
# failures do not block unrelated work.

on:
  schedule:
    # Daily at 14:30 UTC.
    - cron: '30 14 * * *'
  workflow_dispatch:

jobs:
  patterns-api-live:
    name: Patterns API live checks
    if: github.repository == 'WordPress/wordpress.org'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Install composer dependencies
        run: composer install --no-interaction --no-progress

      - name: Run live e2e group
        working-directory: api.wordpress.org/public_html/patterns/1.0
        run: ${{ github.workspace }}/vendor/bin/phpunit --group e2e
