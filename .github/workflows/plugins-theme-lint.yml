name: Static Analysis (Plugin Directory Theme JS)

on:
  pull_request:
    paths:
    - 'wordpress.org/public_html/wp-content/themes/pub/wporg-plugins-2024/**.js'
    - 'wordpress.org/public_html/wp-content/themes/pub/wporg-plugins-2024/package.json'
    - .github/workflows/plugins-theme-lint.yml
  push:
    branches: [trunk]
    paths:
    - 'wordpress.org/public_html/wp-content/themes/pub/wporg-plugins-2024/**.js'
    - 'wordpress.org/public_html/wp-content/themes/pub/wporg-plugins-2024/package.json'
    - .github/workflows/plugins-theme-lint.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Plugin Directory Theme Coding Standards
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: wordpress.org/public_html/wp-content/themes/pub/wporg-plugins-2024

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: environments/.nvmrc
        cache: npm
        cache-dependency-path: wordpress.org/public_html/wp-content/themes/pub/wporg-plugins-2024/package.json

    # The repository ignores package-lock.json, so resolve from package.json.
    - name: Install dependencies
      run: npm install --no-package-lock --no-audit --no-fund --ignore-scripts

    - name: Lint JavaScript
      run: npm run lint:js
