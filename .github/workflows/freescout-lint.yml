name: Static Analysis (FreeScout JS)

on:
  pull_request:
    paths:
    - 'freescout.wordpress.net/**.js'
    - freescout.wordpress.net/package.json
    - .github/workflows/freescout-lint.yml
  push:
    branches: [trunk]
    paths:
    - 'freescout.wordpress.net/**.js'
    - freescout.wordpress.net/package.json
    - .github/workflows/freescout-lint.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: FreeScout JS Coding Standards
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: freescout.wordpress.net

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: environments/.nvmrc
        cache: npm
        cache-dependency-path: freescout.wordpress.net/package.json

    # The repository ignores package-lock.json, so resolve from package.json.
    - name: Install dependencies
      run: npm install --no-package-lock --no-audit --no-fund --ignore-scripts

    - name: Lint JavaScript
      run: npm run lint:js
