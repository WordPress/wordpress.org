name: Static Analysis (JS/CSS)

on:
  pull_request:
    paths:
    - 'wordpress.org/public_html/style/**'
    - 'wordpress.org/public_html/wp-content/themes/pub/wporg-documentation-2022/**'
    - 'wordpress.org/public_html/wp-content/themes/pub/wporg-plugins-2024/**'
    - 'wordpress.org/public_html/wp-content/themes/pub/wporg-support-2024/**'
    - .github/workflows/js-css-lint.yml
  push:
    branches: [trunk]
    paths:
    - 'wordpress.org/public_html/style/**'
    - 'wordpress.org/public_html/wp-content/themes/pub/wporg-documentation-2022/**'
    - 'wordpress.org/public_html/wp-content/themes/pub/wporg-plugins-2024/**'
    - 'wordpress.org/public_html/wp-content/themes/pub/wporg-support-2024/**'
    - .github/workflows/js-css-lint.yml

# Cancel superseded PR runs; trunk pushes get per-commit groups so queued mirrored commits aren't cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
        - name: Style
          dir: wordpress.org/public_html/style
          prettier: true
        - name: Documentation Theme
          dir: wordpress.org/public_html/wp-content/themes/pub/wporg-documentation-2022
        - name: Plugin Directory Theme
          dir: wordpress.org/public_html/wp-content/themes/pub/wporg-plugins-2024
        - name: Support Theme
          dir: wordpress.org/public_html/wp-content/themes/pub/wporg-support-2024

    defaults:
      run:
        working-directory: ${{ matrix.dir }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: environments/.nvmrc
        cache: npm
        cache-dependency-path: ${{ matrix.dir }}/package-lock.json

    - name: Install dependencies
      run: npm ci --ignore-scripts

    - name: Lint JavaScript
      run: npm run lint:js --if-present

    - name: Lint CSS
      run: npm run lint:css --if-present

    - name: Check formatting
      if: matrix.prettier
      run: npx --no prettier --check .

    # Build output is committed, so a source edit without a rebuild ships stale assets.
    - name: Check build output is up to date
      run: |
        npm run build
        if [ -n "$( git status --porcelain -- . )" ]; then
          git status --short -- .
          echo "::error::Build output is out of date. Run 'npm run build' in ${{ matrix.dir }} and commit the result."
          exit 1
        fi
